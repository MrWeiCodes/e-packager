name: Release

on:
  push:
    tags:
      - "*"

env:
  RELEASE_TAG: ${{ github.ref_name }}

permissions:
  contents: write

jobs:
  build-release:
    name: Build Win32 And x64, Publish Win32
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set Version
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag.Length -gt 128 -or $tag -cnotmatch '^[vV]?[0-9][A-Za-z0-9.+-]*$') {
            throw "Invalid release tag: $tag"
          }
          Set-Content -Encoding utf8BOM -Path src\version.h -Value "#pragma once`r`n`r`n// 自动生成的发布版本号。`r`n#define APP_VERSION `"$tag`""

          if ($tag -match '(?i)(alpha|beta|pre|rc)') {
            "IS_PRERELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "IS_PRERELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build Win32 And x64 Release
        shell: pwsh
        run: |
          msbuild .\e-packager.sln /t:Build "/p:Configuration=Release;Platform=Win32" /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild .\e-packager.sln /t:Build "/p:Configuration=Release;Platform=x64" /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Win32 Release Files
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          $win32PackageRoot = Join-Path $assetRoot "e-packager-$tag-windows-win32"
          $win32ZipPath = Join-Path $assetRoot "e-packager-$tag-windows-win32.zip"

          if (Test-Path $assetRoot) {
            Remove-Item -LiteralPath $assetRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $win32PackageRoot | Out-Null
          Copy-Item .\bin\Win32\Release\* $win32PackageRoot -Recurse -Force
          Compress-Archive -Path (Join-Path $win32PackageRoot '*') -DestinationPath $win32ZipPath -Force

          @(
            "ASSET_ZIPS<<EOF"
            ($win32ZipPath -replace '\\','/')
            "EOF"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate Update Manifest
        shell: pwsh
        run: |
          ./scripts/generate_update_manifest.ps1 -Tag $env:RELEASE_TAG -AssetPath "release-assets/e-packager-$env:RELEASE_TAG-windows-win32.zip" -OutputPath release-assets/update.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'true' && 'false' || 'legacy' }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.ASSET_ZIPS }}
            release-assets/update.json
